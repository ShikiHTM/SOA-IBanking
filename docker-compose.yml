services:
  user_db:
    image: postgres:16-alpine
    container_name: user-db
    ports:
      - "5111:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: user-db
    volumes:
      - user_pgdata:/var/lib/postgresql/data
  
  tuition_db:
    image: postgres:16-alpine
    container_name: tuition-db
    ports:
      - "5112:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: tuition-db
    volumes:
      - tuition_pgdata:/var/lib/postgresql/data
  payment_db:
    image: postgres:16-alpine
    container_name: payment-db
    ports:
      - "5113:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: payment-db
    volumes:
      - payment_pgdata:/var/lib/postgresql/data

volumes:
  user_pgdata:
  tuition_pgdata:
  payment_pgdata: