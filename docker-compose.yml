version: "1.0"
services:
  user_db:
    image: postgres:16-alpine
    container_name: user-db
    ports:
      - "5111:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: user-db
    volumes:
      - pgdata:/var/lib/postgresql/data
  
volumes:
  pgdata: